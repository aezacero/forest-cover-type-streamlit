[project]
name = "cover-type-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scikit-learn==1.8.0",
    "lightgbm==4.6.0",
    "streamlit==1.45.1",
    "joblib==1.4.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
